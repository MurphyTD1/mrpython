name: run-bot

on:
  workflow_dispatch: # Elle tetiklemek için
  # schedule:
  #   - cron: '0 * * * *' # İsteğe bağlı zamanlayıcı

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. ADIM: Depodaki dosyaları sanal sunucuya indirir (En kritik adım)
      - name: Depodaki Kodları Sunucuya Çek
        uses: actions/checkout@v4

      # 2. ADIM: Python ortamını hazırlar
      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. ADIM: Gereksinimleri yükler
      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. ADIM: Botu çalıştırır
      - name: Python Botunu Ateşle
        env:
          # GitHub Secrets kısmına eklediğiniz değişkenler (örnek)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
